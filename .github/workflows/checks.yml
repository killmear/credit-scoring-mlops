name: Credit scoring checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      GX_ANALYTICS_ENABLED: 'false'
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: black --check --line-length 100 src tests
      - run: flake8 src tests
      - name: Reproduce data and model
        run: dvc repro
      - name: Great Expectations data validation
        run: python -m src.validation
      - run: pytest -q
      - run: python -m src.verify
      - name: Build and smoke test Docker
        run: |
          docker build -t credit-scoring .
          docker run -d --name credit-scoring -p 127.0.0.1:8000:8000 credit-scoring
          trap 'docker logs credit-scoring; docker rm -f credit-scoring' EXIT
          for i in $(seq 1 40); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          python -m src.monitor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credit-scoring-results
          path: |
            reports/
            models/
